<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding-site</title>

<style>
body {
    margin:0;
    font-family: 'Georgia', serif;
    background: linear-gradient(to bottom, #87CEEB, #0b3d66);
    text-align:center;
    color:#0b3d66;
}

header {
    background:#0b3d66;
    color:white;
    padding:20px;
    font-size:32px;
}

button {
    background:#0b3d66;
    color:white;
    border:none;
    padding:12px 20px;
    margin:10px;
    border-radius:5px;
    cursor:pointer;
}

button:hover {
    background:#145a8d;
}

.page { display:none; }
.active { display:block; }

.gallery {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.gallery img {
    width:200px;
    margin:10px;
    border-radius:10px;
    border:5px solid white;
}

.hidden {
    display:none;
}
</style>
</head>

<body>

<!-- MAIN -->
<div id="mainPage" class="page active">
    <header>Welcome to Our Wedding</header>
    <h2>Select Option</h2>
    <button onclick="showPage('guestPage')">Guest</button>
    <button onclick="showPage('loginPage')">Bride & Groom</button>
</div>

<!-- LOGIN -->
<div id="loginPage" class="page">
    <header>Bride & Groom Login</header>

    <input type="text" id="username" placeholder="Username" autocomplete="new-password"><br>
    <input type="password" id="password" placeholder="Password" autocomplete="new-password"><br>

    <button onclick="login()">Login</button>
    <button onclick="showPage('mainPage')">Back</button>
</div>

<!-- GUEST PAGE -->
<div id="guestPage" class="page">
    <header id="title">Our Coastal Wedding</header>

    <h2>Upload Photos</h2>
    <input type="file" id="uploadGuest">
    <button onclick="uploadPhoto()">Upload</button>

    <h2>Gallery</h2>
    <div id="gallery" class="gallery"></div>

    <button onclick="showPage('mainPage')">Back</button>

    <!-- ✅ EDIT BUTTON MOVED HERE (ONLY PLACE IT EXISTS) -->
    <button id="editBtn" class="hidden" onclick="showPage('editPage')">
        Edit Page
    </button>
</div>

<!-- ADMIN PAGE (NO EDIT BUTTON HERE ANYMORE) -->
<div id="adminPage" class="page">
    <header id="titleAdmin">Our Coastal Wedding</header>

    <h2>Upload Photos</h2>
    <input type="file" id="uploadAdmin">
    <button onclick="uploadPhoto()">Upload</button>

    <h2>Gallery</h2>
    <div id="galleryAdmin" class="gallery"></div>

    <div>
        <button onclick="logout()">Back</button>
    </div>
</div>

<!-- EDIT PAGE -->
<div id="editPage" class="page">
    <header>Edit Wedding Page</header>

    <input type="text" id="newTitle" placeholder="New Title"><br>
    <button onclick="changeTitle()">Save Title</button><br><br>

    <button onclick="showPage('adminPage')">Back</button>
</div>

<script>
const adminUser = "alexandriaandalexander";
const adminPass = "4/25/26";

let isLoggedIn = false;

/* RESET LOGIN */
function resetLogin() {
    let u = document.getElementById("username");
    let p = document.getElementById("password");

    if (u) u.value = "";
    if (p) p.value = "";
}

/* PAGE SWITCH */
function showPage(page) {

    if (page !== "loginPage") resetLogin();

    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
        p.style.display = "none";
    });

    document.getElementById(page).classList.add("active");
    document.getElementById(page).style.display = "block";

    updateEditButton();
    loadGallery();
}

/* LOGIN */
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === adminUser && pass === adminPass) {
        isLoggedIn = true;
        resetLogin();
        showPage("adminPage");
    } else {
        alert("Wrong login");
    }
}

/* LOGOUT */
function logout() {
    isLoggedIn = false;
    resetLogin();
    showPage("mainPage");
}

/* SHOW/HIDE EDIT BUTTON (ONLY ON GUEST PAGE) */
function updateEditButton() {
    let btn = document.getElementById("editBtn");
    if (!btn) return;

    btn.classList.toggle("hidden", !isLoggedIn);
}

/* UPLOAD */
function uploadPhoto() {
    let file =
        document.getElementById("uploadGuest")?.files[0] ||
        document.getElementById("uploadAdmin")?.files[0];

    if (!file) return;

    let reader = new FileReader();
    reader.onload = function(e) {
        let images = JSON.parse(localStorage.getItem("images")) || [];
        images.push(e.target.result);
        localStorage.setItem("images", JSON.stringify(images));
        loadGallery();
    };
    reader.readAsDataURL(file);
}

/* TITLE */
function changeTitle() {
    let title = document.getElementById("newTitle").value;
    document.getElementById("title").innerText = title;
    document.getElementById("titleAdmin").innerText = title;
}

/* GALLERY */
function loadGallery() {
    let images = JSON.parse(localStorage.getItem("images")) || [];

    let g1 = document.getElementById("gallery");
    let g2 = document.getElementById("galleryAdmin");

    if (g1) g1.innerHTML = "";
    if (g2) g2.innerHTML = "";

    images.forEach(img => {
        let image = document.createElement("img");
        image.src = img;

        if (g1) g1.appendChild(image.cloneNode());
        if (g2) g2.appendChild(image.cloneNode());
    });
}

loadGallery();
</script>

</body>
</html>
